            -   entry-key: entNewArchon
                entry-title: New Archon
                entry-html: |
                    New Archon, established 1723, is a mega-city bordering the Atlantic Ocean. It's split into 5 districts: <span class="entrylink" target="entCentral">Central</span>, <span class="entrylink" target="entUpperRidge">Upper Ridge</span>, <span class="entrylink" target="entCrescentBay">Crescent Bay</span>, <span class="entrylink" target="entLowerHull">Lower Hull</span>, and <span class="entrylink" target="entWestArch">West Arch</span>.
                    With a population of <strong>78 million</strong> over just <strong>4532 km²</strong>, it’s the most populous and dense urban area in the Western Lands.
                    In 2017, New Archon was chosen as the pilot location for a new technology known as the <span class="entrylink" target="entCodex"><a>Codex</a></span>, which would allow the entire city to run on one advanced, interconnected mainframe.
                    The technology was finished and fully implemented after 7 years, in 2024.
                    New Archon has faced numerous societal and economic obstacles, as <strong>criminal organizations</strong> breached security and used the Codex for their own gain.
                    It is currently the most <strong>dangerous</strong> city on the planet, based on average daily non-natural deaths.<br>
                sub-entries:

                    -   entry-key: entCentral
                        entry-title: Central
                        entry-html: |
                            Central is the <strong>heart</strong> of New Archon.
                            The many skyscrapers in this dense metropolis are filled with office space for the richest and most infamous New Archon businesses.
                            Life in Central is fast-paced and intense - the <span class="entrylink" target="entCodex">Codex</span> is meticulously wired throughout the entire district, allowing for exploits to have <strong>faster</strong> and more <strong>widespread effects</strong>.
                            With the help of the Codex's regulation, all of Central is kept entirely <strong>pollution-free</strong>, resulting in the cleanest air out of any major city worldwide.
                            The New Archon <strong>government</strong> operates from Central.<br>

                    -   entry-key: entUpperRidge
                        entry-title: Upper Ridge
                        entry-html: |
                            Upper Ridge is the <strong>wealthiest</strong> district in New Archon.
                            The region is filled with large houses and mansions, with many malls and businesses lining the streets in more urban areas.
                            Due to the difference in wealth, other districts are generally <strong>hostile</strong> towards Upper Ridge residents.<br>

                    -   entry-key: entCrescentBay
                        entry-title: Crescent Bay
                        entry-html: |
                            Crescent Bay contains the <strong>importing</strong> and <strong>exporting</strong> industries of New Archon.
                            The city regularly imports materials such as lumber, steel, and silicon.
                            Common exports include seafood, electronic components, and clothes.
                            The area also features a coastline dotted with beaches available to the public, though they are unpopular.
                            The bay contains few sparsely placed residential areas, mainly housing employees of the nearby companies.
                            Crescent Bay has <strong>low air quality</strong>, which prevents many from choosing to live nearby.<br>

                    -   entry-key: entLowerHull
                        entry-title: Lower Hull
                        entry-html: |
                            Lower Hull houses most <strong>low-income</strong> New Archon residents, sprawling South of the bay.
                            The area was initially undeveloped land, but was eventually developed as population grew and a need for cheaper housing arose.
                            The Codex was implemented less rigidly in Lower Hull due to its <strong>vast</strong> and <strong>expanding</strong> area, meaning that many of the first <span class="entrylink" target="entCodex">Codex</span> exploits originated within its boundaries.<br>

                    -   entry-key: entWestArch
                        entry-title: West Arch
                        entry-html: |
                            West Arch is the largest suburban area in New Archon.
                            Initially, it was higher-class but fell into relative <strong>disrepair</strong> after many wealthy citizens moved to larger properties in Upper Ridge.
                            Citizens of West Arch have long been anti-<span class="entrylink" target="entCodex">Codex</span>, and rumors of severing the district from the rest of New Archon are frequent.
                            So far, they have been <strong>unsuccessful</strong>.
                            The district reports the lowest homicide rate of any in New Archon.<br>

            -   entry-key: entOutsideWorld
                entry-title: Outside World
                entry-html: |
                    <span class="entrylink" target="entNewArchon">New Archon</span> is isolated from the outside world by a harsh surrounding environment which restricts the majority of the population from leaving.
                    <span class="entrylink" target="entCrescentBay">Crescent Bay</span> is the most viable route to emigrate, but is still highly dangerous.
                    The transport vessels that export goods aren't designed to support life, and shipments are subjected to extreme atmospheric conditions, which deters most from attempting an escape.
                    Alliances with other cities have been attempted, but negotiations have never reached a conclusion that would allow New Archon citizens to safely emigrate elsewhere.<br>
                    <br>

                    <strong>The Boundary</strong> is an expanse of land that surrounds New Archon, forming a ring of terrain and water.
                    Mostly consisting of wreckage and decay, few live within it.
                    Small encampments dot the landscape, filled with those who are willing to sacrifice everything to leave the city.
                    Feral animals are the main danger for those residing in the Boundary.<br>
                    <br>

                    <strong>The Threshold</strong> is harsh area acting as a barrier between the Boundary and the Outskirts.
                    Filled with decades of hazardous and household waste piled high, the risk of serious infection is high.
                    Those who attempt traversal must contend with uneven and unpredictable topography - avalanches, deep pits, and sharp objects are commonplace.
                    The water in this area is infectious, and unusual air composition has increased extreme weather conditions.<br>
                    <br>

                    <strong>The Outskirts</strong> are the final zone surrounding New Archon.
                    Complete resource depletion, weapons testing, and chemical spills have ravaged the once-beautiful land.
                    Any contact with the air or water is extremely harmful, as chemical burns form in under two seconds of exposure.
                    Even reinforced and enclosed vehicles must take advanced precautions, as the toxic environment erodes most materials at a rapid pace.
                    Only specialized jets and ships, such as those used for resource trade with outside cities, can traverse the conditions safely.<br>
                    <br>

                    Beyond the Outskirts, lies the outside world.<br>

